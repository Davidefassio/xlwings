name: Build Wheels Only

on:
  workflow_dispatch:

jobs:
  build:
    name: Build wheel
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        platform:
          [
            { os: "windows-latest", target: "x86_64" },
            { os: "ubuntu-latest", target: "x86_64" },
            { os: "macos-15", target: "x86_64" },
            { os: "macos-15", target: "aarch64" },
          ]

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: "x64"
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: aarch64-apple-darwin

      - name: Install Python dependencies
        run: python -m pip install wheel setuptools-rust build

      - name: Set up QEMU
        if: matrix.platform.os == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        if: matrix.platform.os != 'windows-latest'
        with:
          target: ${{ matrix.platform.target }}
          manylinux: auto
          maturin-version: v1.5.1
          command: build
          args: --release --out dist --interpreter ${{ matrix.python-version }}

      - name: Build Windows wheel
        if: matrix.platform.os == 'windows-latest'
        shell: bash
        env:
          BUILD_RUST: 1
        run: python setup.py bdist_wheel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{matrix.python-version}}-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: ./dist
          if-no-files-found: ignore
